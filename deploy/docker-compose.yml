services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/platform.db}
      SECRET_KEY: ${SECRET_KEY:-change-me-before-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      MOCK_LLM: ${MOCK_LLM:-1}
      AGENT_ADAPTER_URL: http://agent-adapter:8010
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - platform-data:/data
      - workspaces:/workspaces
    depends_on:
      agent-adapter:
        condition: service_healthy
    restart: unless-stopped

  agent-adapter:
    build:
      context: ..
      dockerfile: apps/agent-adapter/Dockerfile
    environment:
      AGENT_MODE: ${AGENT_MODE:-mock}
      MOCK_EVENT_DELAY_MS: ${MOCK_EVENT_DELAY_MS:-120}
      AGENT_WORKSPACE_ROOT: /workspaces
      TEST_TIMEOUT_SECONDS: ${TEST_TIMEOUT_SECONDS:-120}
      OPENHANDS_BASE_URL: ${OPENHANDS_BASE_URL:-}
      OPENHANDS_API_KEY: ${OPENHANDS_API_KEY:-}
    ports:
      - "${AGENT_ADAPTER_PORT:-8010}:8010"
    volumes:
      - workspaces:/workspaces
    restart: unless-stopped

volumes:
  platform-data:
  workspaces:
