[project]
name = "ai-fullstack-mvp-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.116.1", "uvicorn[standard]==0.35.0", "sqlalchemy==2.0.43", "httpx==0.28.1", "pydantic-settings==2.10.1"]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
